name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: workflow

jobs:
  # Runs even if the local hook was bypassed or never installed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks needs history to scan it
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: architecture rules
        run: npm run arch
      - name: tests
        run: npm run test
