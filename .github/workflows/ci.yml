name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: workflow

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: architecture rules
        run: npm run arch
      - name: tests
        run: npm run test
